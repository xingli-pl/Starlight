<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>星璃</title>
<style>
  body { font-family: "微软雅黑", sans-serif; max-width: 700px; margin: 30px auto; background: #f0f2f5; }
  #top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #top-bar h2 { margin: 0; color: #333; }
  #clear-btn { padding: 5px 10px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  #chat { background: white; padding: 20px; height: 500px; overflow-y: auto; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .user { text-align: right; color: #007bff; margin: 10px 0; white-space: pre-wrap; word-wrap: break-word; }
  .ai { text-align: left; color: #333; margin: 10px 0; padding: 8px; background: #f8f9fa; border-radius: 6px; white-space: pre-wrap; word-wrap: break-word; position: relative; }
  .ai .copy-btn { position: absolute; top: 5px; right: 5px; padding: 2px 6px; background: #e2e6ea; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; color: #666; }
  .ai .copy-btn:hover { background: #d1d5db; }
  .input-box { display: flex; }
  input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; outline: none; }
  button.send-btn { padding: 12px 25px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-left: 10px; }
  button.send-btn:hover { background: #0056b3; }
</style>
</head>
<body>
  <div id="top-bar">
    <h2>✨ 星璃</h2>
    <button id="clear-btn" onclick="clearChat()">清空对话</button>
  </div>
  <div id="chat"><div class="ai">星璃已上线，请说点什么吧...</div></div>
  <div class="input-box">
    <input type="text" id="msg" placeholder="输入消息，按回车发送..." autofocus>
    <button class="send-btn" onclick="send()">发送</button>
  </div>

<script>
  const chatBox = document.getElementById('chat');
  const msgInput = document.getElementById('msg');
  let history = []; // 维护对话历史

  function copyText(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      btn.innerText = '已复制!';
      setTimeout(() => btn.innerText = '复制', 1500);
    });
  }

  function clearChat() {
    history = [];
    chatBox.innerHTML = '<div class="ai">星璃已上线，请说点什么吧...</div>';
  }

  async function send() {
    const text = msgInput.value.trim();
    if (!text) return;
    
    // 添加用户消息到界面和历史
    chatBox.innerHTML += `<div class="user">你：${text}</div>`;
    history.push({"role": "user", "content": text});
    msgInput.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    // 限制历史长度，防止爆显存和上下文（7B模型超过4096就会崩，这里留点余量）
    if (history.length > 15) {
      history = history.slice(history.length - 15);
    }

    const loadingId = 'load_' + Date.now();
    chatBox.innerHTML += `<div class="ai" id="${loadingId}">星璃正在思考...</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      const res = await fetch('http://127.0.0.1:8000/v1/chat/completions', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          model: "qwen.gguf",
          messages: history, // 发送带有上下文的历史记录
          temperature: 1.0,
          max_tokens: 1500
        })
      });
      const data = await res.json();
      let reply = "";
      if (data.choices && data.choices[0] && data.choices[0].message) {
          reply = data.choices[0].message.content;
      } else if (data.error) {
          reply = "后端报错：" + data.error;
      } else {
          reply = "星璃似乎走神了...";
      }

      // 将AI回复写入历史
      history.push({"role": "assistant", "content": reply});

      const escapeHtml = (unsafe) => unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      
      document.getElementById(loadingId).innerHTML = `
        <div>星璃：${escapeHtml(reply)}</div>
        <button class="copy-btn" onclick="copyText(this, \`${reply.replace(/`/g, '\\`')}\`)">复制</button>
      `;
    } catch (e) {
      document.getElementById(loadingId).innerHTML = `<span style="color:red">连接失败：${e.message}</span>`;
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  msgInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') send();
  });
</script>
</body>
</html>
